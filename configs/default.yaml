experiment:
  name: "multiframe_resunet_a3c"
  variant: "A3c"                   # A1 | A2 | A3a | A3b | A3b-FRF | A3c | A3c-FRF | A3c-Lucky | A3c-Lucky-SSIM (override via --variant)
  output_dir: "./runs"
  seed: 42
  use_wandb: true
  wandb_project: "turbulence-mitigation-static"
  wandb_entity: null
  wandb_log_images: true
  wandb_upload_checkpoints: true

data:
  train_root: "/content/datasets/ATSyn-static/train"
  val_root: "/content/datasets/ATSyn-static/test"
  num_frames: 8
  crop_size: 256
  batch_size: 8
  grad_accum_steps: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  allow_synthetic_fallback: false  # Strictly forbidden: fail loudly on missing dataset

model:
  base_ch: 48                      # 48 (~6.6M params) or 64 (~11.7M params)
  enc_blocks: [2, 2, 3]
  middle_blocks: 4
  dec_blocks: [2, 2, 2]
  dw_expand: 2
  ffn_expand: 2
  drop_out_rate: 0.0
  num_frames: 8
  input_mode: "full"               # mean_only | frames_only | frames_anchor | full
  anchor_type: "mean"              # mean | frf | lucky
  stabilize_in_train: false        # Never stabilize during supervised training
  stabilize_in_eval: false         # Enable for real handheld/windy footage
  frf_bandwidth_h: 0.05
  frf_sigma: 0.5
  lucky_tau: 4.0
  lucky_lambda_s: 0.02

loss:
  charbonnier_weight: 1.0
  charbonnier_eps: 1.0e-3
  fft_weight: 0.05
  edge_weight: 0.05
  ssim_weight: 0.0

optim:
  lr: 2.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4             # Applied ONLY to Conv2d/Linear weights; 0.0 on beta/gamma/norm/bias
  betas: [0.9, 0.999]
  total_steps: 50000
  warmup_steps: 1000
  grad_clip_norm: 1.0
  amp_dtype: "bfloat16"            # "bfloat16" (A100/L4), "float16" (T4 w/ fp32 LayerNorm), "float32"

eval:
  val_interval: 2000
  save_interval: 2000
  log_interval: 50
  tile_size: 256                   # Fixed to match training SCA GlobalAvgPool2d statistics
  tile_overlap: 64
  max_eval_windows: 4              # Windows of N frames averaged in multi-window full-sequence eval
